[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "philngt-contextd"
version = "1.4.0"
description = "Build system for AI coding-agent context"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
contextd = "contextd.cli:main"
contextd-project = "contextd.cmd_graph_project:main"

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5", "build>=1.2,<2", "setuptools>=61.0", "wheel>=0.41"]
authoring = ["jsonschema>=4.18,<5"]

[project.urls]
Repository = "https://github.com/philngt/contextd"
Issues = "https://github.com/philngt/contextd/issues"

[tool.setuptools]
py-modules = []
packages = ["contextd", "contextd.lib"]

[tool.setuptools.package-dir]
contextd = "scripts"
