name: Publish Python distribution

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Version tag containing the reviewed distribution changes (refs/tags/vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit release ref
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          python - <<'PY'
          import os, re
          if not re.fullmatch(r"refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(?:(?:a|b|rc)[0-9]+)?", os.environ["RELEASE_REF"]):
              raise SystemExit("Supply a version tag, not a branch or arbitrary revision")
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Match the tag to distribution metadata
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          if project["name"] != "philngt-contextd":
              raise SystemExit("Unexpected distribution name")
          if os.environ["RELEASE_REF"] != "refs/tags/v" + project["version"]:
              raise SystemExit("Release tag and project.version differ")
          PY

      - name: Install artifact verification tools
        run: python -m pip install ".[test]" "twine>=6,<7"

      - name: Build release artifacts
        run: python -m build

      - name: Verify the exact release wheel and source distribution
        run: python scripts/test_distribution.py --dist-dir dist

      - name: Check Python package metadata
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/philngt-contextd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish with the configured PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
