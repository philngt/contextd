name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node for optional OES integration tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout pinned OES validator
        uses: actions/checkout@v4
        with:
          repository: philngt/oes
          ref: 4ca3f62432099091ecd6a109c053bf83292534c0
          path: .test-dependencies/oes
          persist-credentials: false

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile Python sources
        run: python -m compileall -q scripts

      - name: Verify wheel and source distribution
        run: python scripts/test_distribution.py

      - name: Run test_lint_wiki
        run: python scripts/test_lint_wiki.py

      - name: Run test_atomic_write
        run: python scripts/test_atomic_write.py

      - name: Run test_detect_repetition
        run: python scripts/test_detect_repetition.py

      - name: Run test_contextd_runtime
        run: python scripts/test_contextd_runtime.py

      - name: Run runtime boundary regressions
        run: python scripts/test_runtime_boundaries.py

      - name: Run OES integration tests against the real validator
        env:
          OES_CLI: ${{ github.workspace }}/.test-dependencies/oes/bin/oes.mjs
        run: python scripts/test_oes_context.py

      - name: Verify retrieval misses and the external-project evidence flow
        env:
          OES_CLI: ${{ github.workspace }}/.test-dependencies/oes/bin/oes.mjs
        run: python scripts/test_task_coverage.py

      - name: Validate generated artifacts against schemas
        run: python scripts/test_artifact_schemas.py

      - name: Run wiki lint
        run: python scripts/lint-wiki.py --all-workspaces --wiki-root . --strict

      - name: Check pattern indexes
        run: python scripts/check-patterns-index.py
