name: Pack cognition

on:
  pull_request:
    paths:
      - 'packs/**'
      - 'templates/**'
      - 'scripts/**'
      - 'docs/domain-cognition-packs.md'
      - '.github/workflows/pack-cognition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate pack contracts
        run: contextd pack-validate --all --format text
      - name: Validate domain cognition delivery and compatibility
        run: python scripts/test_pack_cognition.py
