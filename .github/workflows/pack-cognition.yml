name: Pack cognition

on:
  pull_request:
    paths:
      - 'packs/**'
      - 'templates/**'
      - 'scripts/**'
      - '.github/workflows/pack-cognition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate pack contracts
        run: contextd pack-validate --all --format text
      - name: Export clean source for reproducible validation
        run: git archive --format=tar --output="${{ runner.temp }}/pack-validation-source.tar" HEAD
      - name: Upload validation source
        uses: actions/upload-artifact@v4
        with:
          name: pack-validation-source
          path: ${{ runner.temp }}/pack-validation-source.tar
          retention-days: 1
