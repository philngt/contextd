name: Graph Authoring

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'templates/graph-authoring/**'
      - 'examples/graph-authoring/**'
      - 'docs/graph-authoring.md'
      - 'workspaces/default/platform/contracts/graph-authoring.md'
      - 'pyproject.toml'
      - '.github/workflows/graph-authoring.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'templates/graph-authoring/**'
      - 'examples/graph-authoring/**'
      - 'pyproject.toml'
      - '.github/workflows/graph-authoring.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/checkout@v4
        with:
          repository: philngt/oes
          ref: 4ca3f62432099091ecd6a109c053bf83292534c0
          path: .test-deps/oes
      - run: python -m pip install -e '.[authoring,test]'
      - run: python scripts/test_graph_authoring.py -v
      - run: python scripts/test_graph_authoring_oes.py -v
        env:
          OES_CLI: ${{ github.workspace }}/.test-deps/oes/bin/oes.mjs
      - run: python scripts/test_graph_projection.py
      - run: python scripts/test_graph_projection_integration.py
