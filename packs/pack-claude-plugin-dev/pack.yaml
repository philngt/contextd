name: pack-claude-plugin-dev
manifest_version: 2
version: 1.1.0
description: Build Claude Code plugins per Anthropic standards — plugin manifest, slash commands, subagents, skills, hooks, MCP servers
status: stable
category: developer-tooling
reviewed_on: 2026-08-20
audiences: [engineering, ops, security]
task_types: [implement_feature, fix_bug, design, review]
scope_includes: [Claude Code plugin packaging, plugin commands and agents, plugin skills and hooks, plugin MCP configuration]
scope_excludes: [project-local Claude configuration, generic MCP application design]

components:
  - plugin
  - command
  - subagent
  - skill
  - hook
  - plugin-mcp

keywords:
  plugin: [plugin, ".claude-plugin", "plugin.json", marketplace, "claude code plugin"]
  command: ["plugin command", "commands/", "/command", "command frontmatter", "argument-hint", "allowed-tools"]
  subagent: ["plugin agent", "plugin subagent", "agents/", "agent frontmatter", "agent definition"]
  skill: ["plugin skill", "SKILL.md", "skills/", "skill frontmatter", "skill trigger"]
  hook: ["plugin hook", "hooks/hooks.json", "PreToolUse", "PostToolUse", "UserPromptSubmit", "SessionStart"]
  plugin-mcp: ["mcp server config", ".mcp.json", "mcp settings", "stdio mcp"]

files:
  constraints: agents/constraints.md
  coding_rules: agents/coding-rules.md
  validator_rules: agents/pipeline/validator-rules.md
  validator_script: scripts/rules.py
  retrieval_map: agents/pipeline/retrieval-map.md
  prompt_overrides: agents/pipeline/prompt-overrides.md
  common_pitfalls: agents/common-pitfalls.md

conflicts_with: []
