name: pack-web-api
manifest_version: 2
version: 1.1.0
description: REST/GraphQL/gRPC API patterns — input validation, error shape, idempotency, auth boundary, no info leak
status: stable
category: engineering
reviewed_on: 2026-08-20
audiences: [engineering, security, ops]
task_types: [implement_feature, fix_bug, design, incident, review]
scope_includes: [REST endpoints, GraphQL resolvers, gRPC services, shared API boundary controls]
scope_excludes: [event broker message contracts, frontend data fetching state]

components:
  - rest
  - graphql
  - grpc
  - api

keywords:
  rest: ["rest api", "http endpoint", "@RestController", "@GetMapping", "@PostMapping", "@PutMapping", "@DeleteMapping", "@RequestMapping", "route handler"]
  graphql: [graphql, "graphql resolver", "graphql schema", "graphql query", "graphql mutation"]
  grpc: [grpc, protobuf, ".proto", "grpc stub"]
  api: ["api boundary", "api middleware", "@Valid", "@RequestBody", openapi, swagger]

files:
  constraints: agents/constraints.md
  coding_rules: agents/coding-rules.md
  validator_rules: agents/pipeline/validator-rules.md
  validator_script: scripts/rules.py
  retrieval_map: agents/pipeline/retrieval-map.md
  prompt_overrides: agents/pipeline/prompt-overrides.md
  common_pitfalls: agents/common-pitfalls.md

conflicts_with: []
