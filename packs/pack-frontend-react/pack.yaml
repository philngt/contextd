name: pack-frontend-react
manifest_version: 2
version: 1.1.0
description: React/Next.js frontend patterns — hooks rules, a11y, effect cleanup, list keys, no direct state mutation
status: stable
category: engineering
reviewed_on: 2026-08-20
audiences: [engineering, design]
task_types: [implement_feature, fix_bug, design, review]
scope_includes: [React component implementation, React hooks, JSX accessibility, Next.js routing boundaries]
scope_excludes: [framework-neutral visual design, React Native mobile implementation]

components:
  - react
  - hooks
  - jsx
  - nextjs

keywords:
  react: [react, "react component", "useState", "useEffect", "useMemo", "useCallback", "react props"]
  hooks: ["rules of hooks", "custom hook", "hook dependency", "effect cleanup"]
  jsx: [jsx, tsx, "jsx accessibility", "list key", "semantic html"]
  nextjs: [nextjs, "next.js", "app router", "server component", "use client", "use server", "getServerSideProps", "getStaticProps"]

files:
  constraints: agents/constraints.md
  coding_rules: agents/coding-rules.md
  validator_rules: agents/pipeline/validator-rules.md
  validator_script: scripts/rules.py
  retrieval_map: agents/pipeline/retrieval-map.md
  prompt_overrides: agents/pipeline/prompt-overrides.md
  common_pitfalls: agents/common-pitfalls.md

conflicts_with: []
