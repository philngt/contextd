  drift-check: ["drift check", drift, "context drift", "goal drift", "scope drift", "operator drift", "lệch hướng", "lech huong", "trôi context", "troi context"]
  remediation-planning: ["remediation plan", "propose remediation", "đề xuất remediation", "de xuat remediation", "root cause remediation", "remediation acceptance", "verification method missing", "kế hoạch khắc phục", "ke hoach khac phuc", "nghiệm thu khắc phục", "nghiem thu khac phuc"]
  decision-ledger: ["decision log", "decision ledger", ADR, "accepted decision", "revisit trigger", "ghi quyết định", "ghi quyet dinh", "quyết định cần lưu", "quyet dinh can luu"]
  handoff-quality: ["handoff brief", "agent handoff", "session brief", "next agent context", "transfer context", "bàn giao agent", "ban giao agent", "bàn giao phiên", "ban giao phien"]
  workflow-mental-model: ["workflow mental model", "workflow model", "stage map", "quality gate map", "failure mode map", "mô hình quy trình", "mo hinh quy trinh", "bản đồ quy trình", "ban do quy trinh"]
  operator-wayfinding: ["what should I do next", "should I stop", "I am lost", "lost direction", "losing direction", "decision paralysis", "không biết làm gì tiếp", "khong biet lam gi tiep", "có nên dừng lại", "co nen dung lai", "bị lạc hướng", "bi lac huong", "mất phương hướng", "mat phuong huong", "AI quyết định thay", "AI quyet dinh thay"]

retrieval:
