name: pack-operator-steering
manifest_version: 3
version: 0.4.0
description: Agent-operator steering pack — wayfinding, context audits, drift checks, remediation, durable decisions, handoffs, and workflow mental models.
status: beta
category: agent-runtime
reviewed_on: 2026-08-20
audiences: [engineering, product, ba, qc, security, design, ops, domain]
task_types: [implement_feature, fix_bug, design, incident, review]
scope_includes: [operator wayfinding and thinking recovery, context quality audits, task drift diagnosis, remediation planning, durable decisions and handoffs]
scope_excludes: [implementation-domain coding rules, autonomous agent loop mechanics, personal wellbeing or clinical guidance]

components:
  - context-audit
  - drift-check
  - remediation-planning
  - decision-ledger
  - handoff-quality
  - workflow-mental-model
  - operator-wayfinding

keywords:
