name: pack-ui-ux
manifest_version: 3
version: 0.3.0
description: UI/UX pack — design system, accessibility (WCAG), user flows, và UX writing conventions.
status: beta
category: design
reviewed_on: 2026-08-20
audiences: [design, product, ba, engineering]
task_types: [implement_feature, design, review]
scope_includes: [design systems, WCAG accessibility, interaction flows, interface microcopy]
scope_excludes: [framework-specific component code, product strategy and roadmap]

components:
  - design-system
  - accessibility
  - user-flows
  - ux-writing

keywords:
  design-system: [design system, component library, design token, figma, storybook, design spec]
  accessibility: [a11y, wcag, aria, screen reader, contrast ratio, keyboard navigation, focus trap]
  user-flows: [user flow, screen flow, wireframe, prototype, interaction design, happy path, edge case]
  ux-writing: [ux writing, microcopy, content guidelines, tone of voice, copy, placeholder, error message, cta]

retrieval:
  design-system: [platform/design/design-system.md, platform/design/tokens.md]
  accessibility: [platform/design/a11y.md]
  user-flows: [domains/{domain}/flows/*.md]
  ux-writing: [platform/design/ux-writing.md]

files:
  knowledge: knowledge.md
  constraints: agents/constraints.md
  coding_rules: agents/coding-rules.md
  validator_rules: agents/pipeline/validator-rules.md
  validator_script: scripts/rules.py
  retrieval_map: agents/pipeline/retrieval-map.md
  prompt_overrides: agents/pipeline/prompt-overrides.md
  common_pitfalls: agents/common-pitfalls.md

conflicts_with: []
