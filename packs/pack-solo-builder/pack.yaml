name: pack-solo-builder
manifest_version: 2
version: 0.2.0
description: Evidence-aware tool discovery, recipe selection, and maintainable single-purpose workflows for non-technical domain experts.
status: beta
category: enablement
reviewed_on: 2026-08-20
audiences: [domain]
task_types: [implement_feature, design, review]
scope_includes: [single-purpose personal tool discovery, recipe-based technology selection, reusable domain tool catalog]
scope_excludes: [production systems with formal SLOs, professional software architecture, unreviewed safety-critical or regulated decision automation]

components:
  - tool-design
  - tool-extend
  - recipe
  - tool-catalog

keywords:
  tool-design: ["thiết kế công cụ", "tool design", "tự động hóa công việc", "personal tool idea", "công cụ cá nhân"]
  tool-extend: ["mở rộng công cụ", "extend existing tool", "update tool spec", "thêm chức năng tool"]
  recipe: ["technology recipe", "tech stack recipe", "công thức công nghệ", "recipe match"]
  tool-catalog: ["tool catalog", "list existing tools", "danh sách công cụ", toolbox, "ngăn kéo công cụ"]

files:
  constraints: agents/constraints.md
  coding_rules: agents/coding-rules.md
  validator_rules: agents/pipeline/validator-rules.md
  validator_script: scripts/rules.py
  retrieval_map: agents/pipeline/retrieval-map.md
  prompt_overrides: agents/pipeline/prompt-overrides.md
  common_pitfalls: agents/common-pitfalls.md

conflicts_with: []
