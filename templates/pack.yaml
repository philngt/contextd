# Skeleton for a new contextd pack. Copy to packs/{your-pack}/pack.yaml.
# Convention: lowercase `pack-{slug}` name, kebab-case components.

name: pack-{your-name}
manifest_version: 3
version: 0.1.0
description: "Describe the concrete workflow or artifact this pack owns in at least forty characters."
status: experimental
category: engineering
reviewed_on: YYYY-MM-DD

# Runtime intent contract. Values must match templates/pack.schema.json.
audiences: [engineering]
task_types: [implement_feature, fix_bug, design, review]

# Make the ownership boundary explicit so neighboring packs stay narrow.
scope_includes:
  - concrete workflow or artifact this pack owns
scope_excludes:
  - neighboring concern owned by another pack

components:
  - component-one
  - component-two

# Use at least three specific, globally unique signals for each component.
# Avoid generic words such as build, fix, component, query, handoff, or audit.
keywords:
  component-one: ["specific phrase one", "specific phrase two", "owned artifact one"]
  component-two: ["specific phrase three", "specific phrase four", "owned artifact two"]

# Manifest v3 owns routing here; no separate retrieval-map is required.
retrieval:
  component-one: ["projects/{project}/knowledge-map.md", "platform/patterns/owned-pattern.md"]
  component-two: ["projects/{project}/knowledge-map.md", "platform/contracts/owned-contract.md"]

# knowledge.md is the canonical human/runtime guidance. Runtime loads Global
# Principles plus only the component sections selected for the current task.
files:
  knowledge: knowledge.md
  validator_script: scripts/rules.py

conflicts_with: []
